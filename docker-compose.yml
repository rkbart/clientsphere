version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clientsphere
      POSTGRES_PASSWORD: clientsphere
      POSTGRES_DB: clientsphere_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://clientsphere:clientsphere@postgres:5432/clientsphere_development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      MISSION_CONTROL_USER: ${MISSION_CONTROL_USER}
      MISSION_CONTROL_PASSWORD: ${MISSION_CONTROL_PASSWORD}
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: bin/jobs start
    environment:
      DATABASE_URL: postgres://clientsphere:clientsphere@postgres:5432/clientsphere_development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    depends_on:
      - postgres
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      - api

volumes:
  pgdata:
