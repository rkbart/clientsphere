# Render Blueprint for ClientSphere (Render + Neon, see docs/DEPLOYMENT.md).
# Apply: Render dashboard → New → Blueprint → pick this repo.
# The web frontend lives on Vercel (apps/web) — only the Rails API runs
# here. Free tier has no background workers, so Solid Queue runs inside
# Puma (SOLID_QUEUE_IN_PUMA); jobs process whenever the web service is
# awake. Need 24/7 schedules? Upgrade and add a `worker` service running
# `bin/jobs start` (Starter plan).
# Database is Neon (external): paste the DIRECT, non-pooled connection string
# (hostname WITHOUT "-pooler", with ?sslmode=require). The pooled endpoint
# breaks Solid Queue advisory locks — do not use it.

services:
  - type: web
    name: clientsphere-api
    runtime: ruby
    region: singapore
    plan: free
    # Monorepo: the Rails app lives in apps/api (no Gemfile at repo root,
    # so without this the Ruby build fails). Commands run relative to it.
    rootDir: apps/api
    # NOTE: no preDeployCommand — Render free tier rejects it. Migrations
    # run at build time instead (DATABASE_URL is available to builds).
    buildCommand: bundle install && SECRET_KEY_BASE_DUMMY=1 ./bin/rails assets:precompile && bin/rails db:migrate && (printf 'precedence ::ffff:0:0/96 100\n' >> /etc/gai.conf || true)
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - fromGroup: clientsphere-settings

envVarGroups:
  - name: clientsphere-settings
    envVars:
      - key: RAILS_ENV
        value: production
      # Ship Rails logs to stdout so they appear in Render logs.
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # Run Solid Queue (dispatcher + workers + scheduler) inside Puma —
      # there is no separate worker service on the free tier.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Neon DIRECT connection string (NOT the -pooler one), with ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      # Encryption keys for workspace credentials — must be real values in
      # production (the codebase falls back to insecure dev defaults).
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      # Public web origin (your Vercel URL) — used in email links + OAuth landing.
      - key: WEB_URL
        sync: false
      # Public API origin (https://clientsphere-api.onrender.com) — shown as
      # the Resend webhook URL in Settings → Email.
      - key: APP_HOST
        sync: false
      - key: MISSION_CONTROL_USER
        value: admin
      - key: MISSION_CONTROL_PASSWORD
        generateValue: true
      # Optional: Google OAuth (also register GOOGLE_REDIRECT_URI in Google Cloud Console).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional: global email credentials (per-workspace settings win).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
