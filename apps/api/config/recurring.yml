# Recurring tasks run by the Solid Queue scheduler (see config/queue.yml).
# Sequence email chains self-schedule their next step via SequenceStepJob.
development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  fire_overdue_activity_triggers:
    class: OverdueActivityCheckJob
    schedule: every hour at minute 30
  poll_gmail_inboxes:
    class: GmailInboxPollJob
    schedule: every 15 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  fire_overdue_activity_triggers:
    class: OverdueActivityCheckJob
    schedule: every hour at minute 30
  poll_gmail_inboxes:
    class: GmailInboxPollJob
    schedule: every 15 minutes
