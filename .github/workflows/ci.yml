name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clientsphere
          POSTGRES_PASSWORD: clientsphere
          POSTGRES_DB: clientsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: apps/api/.ruby-version
          bundler-cache: true
          working-directory: apps/api

      - name: Set up database
        env:
          DATABASE_URL: postgres://clientsphere:clientsphere@localhost:5432/clientsphere_test
          RAILS_ENV: test
        run: bin/rails db:prepare

      - name: Run RSpec
        env:
          DATABASE_URL: postgres://clientsphere:clientsphere@localhost:5432/clientsphere_test
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager -q || true

      - name: Run bundler-audit
        run: bundle exec bundler-audit check --update || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test || true

      - name: Build
        run: pnpm build
